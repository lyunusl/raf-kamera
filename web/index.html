<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d2523'/%3E%3Crect x='8' y='6.5' width='5' height='4.5' rx='1' fill='%2333b3a3'/%3E%3Crect x='14.5' y='6.5' width='4' height='4.5' rx='1' fill='%237ed957'/%3E%3Crect x='8' y='14' width='3.5' height='4.5' rx='1' fill='%237ed957'/%3E%3Crect x='13' y='14' width='5.5' height='4.5' rx='1' fill='%2333b3a3'/%3E%3Crect x='20' y='14' width='4' height='4.5' rx='1' fill='%2333b3a3'/%3E%3Crect x='17' y='21.5' width='7' height='4.5' rx='1' fill='%237ed957'/%3E%3Cpath d='M6 11.5h20M6 19h20M6 26.5h20' stroke='%23cfeee6' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Raf Kamera</title>
<style>
:root{
  --zemin:#f3f6f4;--kart:#fff;--cizgi:#dfe6e2;--cizgi2:#cdd7d2;--yazi:#141a19;--soluk:#5f6a67;--soluk2:#8c9894;
  --ray:#0d2523;--ray-ust:#163633;--ray-secili:#11433e;--vurgu:#0f8b7d;--vurgu-koyu:#0b7166;--vurgu-acik:#d7f0eb;--isik:#7ed957;
  --kirmizi-acik:#fde2dc;--yesil:#2f8f6b;--yesil-acik:#dff3ea;--sari:#e5a12a;--sari-acik:#fdf1d4;
  --mavi:#2f6fe0;--mavi-acik:#e3ecfd;--kritik:#c8170d;--yuksek:#e0670f;--orta:#e5a12a;--dusuk:#8a93a3;--mor:#7c5cd6;--mor-acik:#ece6fb;
  --mono:"Cascadia Mono","Consolas","SFMono-Regular",monospace;--govde:"Segoe UI",system-ui,-apple-system,sans-serif;
  --d-dolu:#2f8f6b;--d-az:#e5a12a;--d-bos:#d64532;--d-yanlis:#7c5cd6;--d-kapali:#97a29e;--d-bilinmiyor:#c7d0cc;
}
*{box-sizing:border-box}html,body{height:100%}[hidden]{display:none!important}
body{margin:0;background:var(--zemin);color:var(--yazi);font:14px/1.45 var(--govde);display:flex}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--vurgu);outline-offset:2px;border-radius:6px}
.ray{width:76px;background:var(--ray);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px;position:sticky;top:0;height:100vh;flex:none;z-index:15;overflow-y:auto;scrollbar-width:none}
.ray .marka{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;margin-bottom:10px;flex:none}
.ray a{width:62px;padding:7px 0 5px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#a7b3b0;text-decoration:none;font-size:10.5px;position:relative;flex:none}
.ray a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ray a:hover{color:#fff;background:var(--ray-ust)}
.ray a.secili{color:#fff;background:var(--ray-secili)}.ray a.secili svg{stroke:var(--isik)}
.ray a .rozet{position:absolute;top:2px;right:7px;min-width:17px;height:17px;border-radius:9px;background:var(--kritik);color:#fff;font:700 10px/17px var(--govde);text-align:center;padding:0 4px}
.ray .bosluk{flex:1;min-height:8px}
.govde-alan{flex:1;min-width:0;display:flex;flex-direction:column}
.ustbar{position:sticky;top:0;z-index:12;background:rgba(243,246,244,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--cizgi);display:flex;align-items:center;gap:10px;padding:10px 26px;flex-wrap:wrap}
.ustbar .tesis{font-weight:650;font-size:14px;white-space:nowrap}.ustbar .tesis small{color:var(--soluk);font-weight:500;margin-left:6px}
.arama{position:relative;flex:1;max-width:420px;min-width:180px}
.arama input{width:100%;border:1px solid var(--cizgi2);border-radius:10px;padding:7px 12px 7px 32px;background:#fff}
.arama svg{position:absolute;left:10px;top:9px;width:16px;height:16px;stroke:var(--soluk2);fill:none;stroke-width:2}
.arama-sonuc{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--cizgi2);border-radius:12px;box-shadow:0 12px 30px rgba(20,26,25,.14);max-height:360px;overflow:auto;z-index:30}
.arama-sonuc a{display:flex;gap:10px;align-items:center;padding:8px 12px;text-decoration:none;border-bottom:1px solid #f0f3f1}
.arama-sonuc a:hover,.arama-sonuc a.aktif{background:var(--vurgu-acik)}
.arama-sonuc small{color:var(--soluk)}
.ustbar .sag{margin-left:auto;display:flex;gap:8px;align-items:center}
.zil{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--cizgi2);background:#fff;display:grid;place-items:center;cursor:pointer}
.zil svg{width:18px;height:18px;stroke:var(--yazi);fill:none;stroke-width:1.8}
.zil .nokta{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--kritik);color:#fff;font:700 10px/18px var(--govde);text-align:center;padding:0 4px}
.zil-panel{position:absolute;right:0;top:calc(100% + 6px);width:360px;background:#fff;border:1px solid var(--cizgi2);border-radius:14px;box-shadow:0 16px 40px rgba(20,26,25,.16);z-index:30;padding:10px}
.zil-panel .bas{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;border-bottom:1px solid var(--cizgi);margin-bottom:6px}
.ornek-rozet{background:var(--mor-acik);color:#4a2fa6;border:1px solid #d4c8f6;border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:600;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.ornek-rozet button{border:0;background:none;color:#4a2fa6;text-decoration:underline;cursor:pointer;padding:0;font-weight:600}
main{flex:1;min-width:0;padding:18px 26px 60px}
.ust{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ust h1{font-size:21px;margin:0;letter-spacing:-.01em;flex:1;min-width:200px}
.ust h1 small{display:block;font:500 12.5px var(--govde);color:var(--soluk);letter-spacing:0;margin-top:2px}
.cip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--cizgi2);background:var(--kart);border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap}
select.cip{appearance:auto;cursor:pointer;padding:6px 8px}
input.cip{padding:5px 8px}
.dug{border:1px solid var(--cizgi2);background:var(--kart);border-radius:10px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--yazi)}
.dug:hover{border-color:#a9b6b1}.dug.ana{background:var(--vurgu);border-color:var(--vurgu);color:#fff}.dug.ana:hover{background:var(--vurgu-koyu)}
.dug.koyu{background:var(--ray);border-color:var(--ray);color:#fff}.dug.kucuk{padding:4px 9px;font-size:12.5px;border-radius:8px}
.dug.tehlike{color:var(--kritik)}.dug:disabled{opacity:.5;cursor:default}.dug.secili{background:var(--vurgu-acik);border-color:var(--vurgu);color:var(--vurgu-koyu)}
.dug svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.grup{display:inline-flex;border:1px solid var(--cizgi2);border-radius:10px;overflow:hidden;background:#fff}
.grup button{border:0;background:none;padding:6px 11px;font-size:13px;font-weight:600;color:var(--soluk);cursor:pointer;border-right:1px solid var(--cizgi);white-space:nowrap}
.grup button:last-child{border-right:0}.grup button.secili{background:var(--vurgu-acik);color:var(--vurgu-koyu)}
.grup button .n{font:600 11px var(--mono);margin-left:5px;color:var(--soluk2)}.grup button.secili .n{color:var(--vurgu-koyu)}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px 16px;min-width:0}
.kart-bas{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-height:26px}
.kart-bas h2{font-size:14px;margin:0;flex:1;font-weight:650}
.kart-bas h2 small{font-weight:500;color:var(--soluk);font-size:12px;margin-left:6px}
.et{font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--soluk2);text-transform:uppercase}
.izgara{display:grid;gap:14px}
.ikili{grid-template-columns:repeat(2,minmax(0,1fr))}.uclu{grid-template-columns:repeat(3,minmax(0,1fr))}.dortlu{grid-template-columns:repeat(4,minmax(0,1fr))}
.iki{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}.iki-ters{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
.bosluk-alt{margin-bottom:14px}
.kpi{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:12px 14px 10px;display:flex;flex-direction:column;min-width:0;text-decoration:none;color:inherit;position:relative}
a.kpi:hover{border-color:var(--vurgu)}
.kpi .et{display:flex;gap:6px;align-items:center}
.kpi .deger{font-size:27px;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .deger small{font-size:14px;color:var(--soluk);font-weight:500;margin-left:3px}
.kpi .alt{color:var(--soluk);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:19px}
.kpi.kpi-uyari .deger{color:var(--kritik)}
.tahmin{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--sari-acik);color:#7a5300;border-radius:5px;padding:1px 5px}
.fark{font:600 11px var(--mono);padding:1px 6px;border-radius:6px;background:var(--yesil-acik);color:var(--yesil);white-space:nowrap}
.fark.kotu{background:var(--kirmizi-acik);color:var(--kritik)}.fark.notr{background:#eef1ef;color:var(--soluk)}
.not{color:var(--soluk);font-size:12.5px}
.kameralar{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.kam{border:1px solid var(--cizgi);border-radius:12px;overflow:hidden;background:#0f1115;position:relative;cursor:pointer;aspect-ratio:16/9;display:block}
.kam img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.kam .ad{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;align-items:center;font:600 11px var(--govde);color:#fff}
.kam .ad span{background:rgba(10,12,16,.74);padding:3px 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kam .acik{position:absolute;top:8px;right:8px;background:var(--kritik);color:#fff;font:700 11px var(--govde);padding:2px 8px;border-radius:8px}
.kam .hal{position:absolute;top:8px;left:8px;background:rgba(10,12,16,.74);color:#fff;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.kam .hal.canli{background:var(--yesil)}.kam .hal.alarm{background:var(--kritik)}.kam .hal.eski{background:var(--sari);color:#3b2a00}.kam .hal.ornek{background:var(--mor)}
.kam.alarm{border-color:var(--kritik);box-shadow:0 0 0 2px var(--kritik)}
.kam .bos{position:absolute;inset:0;display:grid;place-items:center;color:#8d939e;font-size:12.5px;text-align:center;padding:10px}
.rozet{display:inline-block;font:700 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;color:#fff;white-space:nowrap;vertical-align:1px}
.rozet.kritik{background:var(--kritik)}.rozet.yuksek{background:var(--yuksek)}.rozet.orta{background:var(--sari);color:#3b2a00}.rozet.dusuk{background:#e7ebe9;color:#4b5552}
.rozet.ciddi{background:#111318}.rozet.gri{background:#eceeed;color:#4b5552}.rozet.yesil{background:var(--yesil-acik);color:var(--yesil)}
.rozet.sari{background:var(--sari-acik);color:#7a5300}.rozet.kirmizi{background:var(--kirmizi-acik);color:var(--kritik)}.rozet.mor{background:var(--mor-acik);color:#4a2fa6}.rozet.mavi{background:var(--mavi-acik);color:#1e4fae}
.d-rozet{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.d-rozet i{width:9px;height:9px;border-radius:3px;display:inline-block}
.uyari{display:flex;gap:11px;padding:9px 10px;border:1px solid var(--cizgi);border-radius:12px;cursor:pointer;background:var(--kart);align-items:center;text-align:left;width:100%}
.uyari:hover,.uyari.secili{border-color:var(--vurgu)}
.uyari img,.uyari .yok{width:96px;height:54px;border-radius:8px;object-fit:cover;background:#16181d;flex:none}
.uyari .govde{min-width:0;flex:1}.uyari .bas{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uyari .alt{color:var(--soluk);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liste{display:flex;flex-direction:column;gap:8px}
.dikkat{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid #eef1ef;text-decoration:none;color:inherit;cursor:pointer}
.dikkat:last-child{border-bottom:0}.dikkat:hover{background:#f7faf8}
.dikkat .sim{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font:700 12px var(--govde)}
.dikkat .metin{flex:1;min-width:0}.dikkat .metin b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.dikkat .metin span{color:var(--soluk);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dikkat .zaman{font:600 11.5px var(--mono);color:var(--soluk);white-space:nowrap}
.kaydir{max-height:420px;overflow:auto}
.tablo-kap{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.07em;color:var(--soluk2);text-transform:uppercase;padding:7px 8px;border-bottom:1px solid var(--cizgi);white-space:nowrap;background:var(--kart);position:sticky;top:0}
th.sirala{cursor:pointer}th.sirala:hover{color:var(--yazi)}
td{padding:7px 8px;border-bottom:1px solid #eef1ef;vertical-align:middle}td.s,th.s{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}tbody tr.tik{cursor:pointer}tbody tr.tik:hover td{background:#f7faf8}
.cubuk{height:7px;border-radius:4px;background:#eef1ef;overflow:hidden;min-width:50px}.cubuk i{display:block;height:100%;background:var(--vurgu);border-radius:4px}
.sekmeler{display:flex;gap:2px;border-bottom:1px solid var(--cizgi);margin-bottom:14px;flex-wrap:wrap}
.sekmeler button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--soluk);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.sekmeler button.secili{color:var(--yazi);border-color:var(--vurgu)}
.sahne{position:relative;border-radius:12px;overflow:hidden;background:#0f1115;line-height:0;user-select:none}
.sahne img{width:100%;display:block}
.sahne svg,.sahne canvas{position:absolute;inset:0;width:100%;height:100%}
.sahne .bosyazi{aspect-ratio:16/9;display:grid;place-items:center;color:#8d939e;line-height:1.5;text-align:center;padding:20px}
.sahne .goz-kutu{cursor:pointer}
.sahne .goz-kutu:hover rect{stroke-width:3}
.cekmece{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--kart);border-left:1px solid var(--cizgi2);box-shadow:-18px 0 40px rgba(20,20,20,.12);padding:18px 20px 30px;overflow:auto;z-index:25}
.cekmece video,.cekmece img.buyuk{width:100%;border-radius:12px;background:#0f1115;display:block}
.cekmece h2{margin:0;font-size:18px}
.cekmece-bas{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}.cekmece-bas>div{flex:1;min-width:0}
.bilgi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.bilgi div{border:1px solid var(--cizgi);border-radius:10px;padding:7px 10px}.bilgi b{display:block;font-size:16px}.bilgi .et{font-size:9.5px}
.form label{display:block;font-size:12.5px;color:var(--soluk);margin:10px 0 4px}
.form input:not([type=checkbox]):not([type=radio]),.form select,.form textarea{width:100%;border:1px solid var(--cizgi2);border-radius:9px;padding:7px 10px;background:#fff}
.form textarea{min-height:64px;resize:vertical}.form .satir{display:flex;gap:8px}.form .satir>*{flex:1;min-width:0}
.form .hata-alan{border-color:var(--kritik)!important}
.perde{position:fixed;inset:0;background:rgba(15,17,21,.45);z-index:30;display:grid;place-items:center;padding:20px}
.pencere{background:var(--kart);border-radius:16px;padding:20px 22px;width:min(560px,100%);max-height:92vh;overflow:auto}
.pencere h2{margin:0 0 4px;font-size:18px}
.eylemler{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.kayit{background:#0f1115;color:#d7dbe4;border-radius:10px;padding:10px 12px;font:12px/1.5 var(--mono);max-height:230px;overflow:auto;white-space:pre-wrap}
.bos-durum{border:1.5px dashed var(--cizgi2);border-radius:16px;padding:34px 24px;text-align:center;color:var(--soluk);background:rgba(255,255,255,.5)}
.bos-durum h3{color:var(--yazi);margin:0 0 6px;font-size:17px}.bos-durum p{margin:6px auto;max-width:560px}
.bos-durum .eylemler{justify-content:center}
.uyari-seridi{background:var(--sari-acik);border:1px solid #f0d58f;color:#5c4200;border-radius:12px;padding:9px 14px;margin-bottom:14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.uyari-seridi.bilgi-seridi{background:var(--mavi-acik);border-color:#c5d6f7;color:#1e3f84}
.uyari-seridi.mor-seridi{background:var(--mor-acik);border-color:#d4c8f6;color:#3d2690}
.kural{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #eef1ef}.kural:last-child{border:0}
.kural .ad{font-weight:650}.kural .ac{color:var(--soluk);font-size:12.5px}
.yukleniyor{color:var(--soluk);padding:40px 0;display:flex;gap:10px;align-items:center}
.don{width:16px;height:16px;border:2px solid var(--cizgi);border-top-color:var(--vurgu);border-radius:50%;animation:don 1s linear infinite;flex:none;display:inline-block}
@keyframes don{to{transform:rotate(360deg)}}
.iskelet{background:linear-gradient(90deg,#eef1ef 25%,#f6f8f7 50%,#eef1ef 75%);background-size:200% 100%;animation:iskelet 1.3s infinite;border-radius:14px}
@keyframes iskelet{to{background-position:-200% 0}}
#bildirimler{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.bildirim{background:var(--ray);color:#fff;border-radius:12px;padding:10px 16px;font-size:13.5px;max-width:80vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.bildirim.hata{background:#7f1d14}
/* grafikler */
.grafik{width:100%;min-height:20px}
.grafik svg{display:block;overflow:visible}
.g-eksen{font:11px var(--govde);fill:var(--soluk2)}
.g-halka-orta{font:650 15px var(--govde);fill:var(--yazi)}
.grafik-bos{display:grid;place-items:center;color:var(--soluk2);font-size:12.5px;border:1px dashed var(--cizgi);border-radius:10px}
.g-gosterge{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--soluk);margin-top:6px}
.g-gosterge span{display:inline-flex;gap:6px;align-items:center}.g-gosterge i{width:12px;height:10px;border-radius:3px;display:inline-block}
.huni{display:flex;flex-direction:column;gap:8px}
.huni-satir{display:grid;grid-template-columns:72px 1fr 110px;gap:10px;align-items:center}
.huni-ad{font-size:13px;font-weight:600}
.huni-cubuk{position:relative;height:30px;background:#f1f4f2;border-radius:8px;overflow:hidden}
.huni-cubuk i{display:block;height:100%;border-radius:8px}
.huni-cubuk b{position:absolute;left:10px;top:6px;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.huni-oran{font:650 15px var(--govde)}.huni-oran small{display:block;font:500 11px var(--govde);color:var(--soluk)}
.halka{display:flex;gap:14px;align-items:center}
.halka-liste{flex:1;display:flex;flex-direction:column;gap:5px;font-size:13px;min-width:0}
.halka-liste div{display:flex;gap:7px;align-items:center}.halka-liste i{width:10px;height:10px;border-radius:3px}.halka-liste span{flex:1}
.yatay{display:flex;flex-direction:column;gap:7px}
.yatay-satir{display:grid;grid-template-columns:minmax(90px,38%) 1fr 64px;gap:10px;align-items:center;font-size:13px}
.yatay-ad{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.yatay-ad small{color:var(--soluk);margin-left:6px}
.yatay-cubuk{height:10px;background:#f1f4f2;border-radius:5px;overflow:hidden}.yatay-cubuk i{display:block;height:100%;border-radius:5px}
.yatay-satir b{text-align:right;font-variant-numeric:tabular-nums}
/* raflar */
.durum-serit{display:flex;gap:6px;flex-wrap:wrap}
.planogram{display:flex;flex-direction:column;gap:14px}
.pg-bolge h3{font-size:13.5px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.pg-satir{display:grid;gap:6px;margin-bottom:6px}
.pg-goz{border:1px solid var(--cizgi);border-radius:10px;padding:6px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;border-top:4px solid var(--d-bilinmiyor);text-align:left}
.pg-goz:hover{border-color:var(--vurgu)}
.pg-goz img{width:100%;height:48px;object-fit:contain;background:#f6f8f7;border-radius:6px}
.pg-goz .ad{font-size:11.5px;font-weight:600;line-height:1.25;height:2.5em;overflow:hidden}
.pg-goz .alt{display:flex;justify-content:space-between;font:600 10.5px var(--mono);color:var(--soluk)}
.pg-goz.soluk{opacity:.35}
.goz-ozet{display:flex;gap:12px;align-items:center}
.goz-ozet img{width:64px;height:64px;object-fit:contain;background:#f6f8f7;border-radius:10px;border:1px solid var(--cizgi)}
.urun-kartlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.urun-kart{border:1px solid var(--cizgi);border-radius:14px;background:#fff;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.urun-kart:hover{border-color:var(--vurgu)}
.urun-kart img,.urun-kart .yer{width:100%;height:110px;object-fit:contain;background:#f6f8f7;border-radius:10px}
.urun-kart b{font-size:13.5px}
.kucuk-gorsel{width:36px;height:36px;object-fit:contain;background:#f6f8f7;border-radius:7px;border:1px solid var(--cizgi);display:block}
.gorseller{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.gorseller figure{margin:0;position:relative;border:1px solid var(--cizgi);border-radius:10px;overflow:hidden;background:#f6f8f7}
.gorseller img{width:100%;height:88px;object-fit:contain;display:block}
.gorseller button{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:rgba(255,255,255,.92);cursor:pointer;font-size:12px;padding:1px 6px;color:var(--kritik)}
.kirpma{position:relative;line-height:0;border-radius:10px;overflow:hidden;background:#0f1115;user-select:none;cursor:crosshair}
.kirpma img{width:100%;display:block}
.kirpma .kutu{position:absolute;border:2px solid #7ed957;background:rgba(126,217,87,.15);pointer-events:none}
/* düzenleyici */
.duzen{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.arac{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.arac .ayrac{width:1px;height:24px;background:var(--cizgi);margin:0 4px}
.cizim svg{cursor:crosshair}
.cizim .bosyazi{color:#6b717c;font-size:12.5px;align-items:start;place-items:start center;padding-top:10px}
.cizim.sec svg{cursor:default}
.bolge-liste{display:flex;flex-direction:column;gap:6px}
.bolge-oge{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--cizgi);border-radius:10px;cursor:pointer;background:#fff;text-align:left;width:100%}
.bolge-oge.secili{border-color:var(--vurgu);background:var(--vurgu-acik)}
.bolge-oge i{width:12px;height:12px;border-radius:4px;flex:none}
.bolge-oge>span:not(.rozet){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipucu{font-size:12.5px;color:var(--soluk);background:#f6f8f7;border:1px solid var(--cizgi);border-radius:10px;padding:8px 10px;margin-top:10px}
.yazdir-baslik{display:none}
details.izleme{border:1px solid var(--cizgi);border-radius:10px;padding:8px 10px;margin-bottom:6px}details.izleme summary{cursor:pointer;display:flex;gap:8px;align-items:center}
@media print{
  body{display:block;background:#fff}.ray,.ustbar,#katman,.yazdirma,.ust .dug,.ust select,.ust .grup,dialog{display:none!important}
  main{padding:0}.kart,.kpi{break-inside:avoid;border-color:#ccc}.yazdir-baslik{display:block;margin-bottom:10px}
  .izgara.dortlu{grid-template-columns:repeat(4,1fr)}.iki,.iki-ters{grid-template-columns:1fr 1fr}.tablo-kap{overflow:visible}
}
.rehber-isik{position:fixed;border-radius:12px;box-shadow:0 0 0 200vmax rgba(15,17,21,.62);outline:2.5px solid var(--vurgu);pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s}
#rehber{position:fixed;inset:0;z-index:60}
.rehber-isik.yok{outline:0;box-shadow:none;border-radius:0;background:rgba(15,17,21,.62);transition:none}
.rehber-kart{position:fixed;width:min(370px,calc(100vw - 24px));background:var(--kart);border-radius:16px;padding:16px 18px 14px;box-shadow:0 18px 50px rgba(0,0,0,.3);transition:left .2s,top .2s}
.rehber-kart h3{margin:0 26px 6px 0;font-size:16.5px}
.rehber-kart p{margin:0 0 12px;color:#3b3f48;font-size:13.5px;line-height:1.5}
.rehber-alt{display:flex;align-items:center;gap:8px}
.rehber-say{flex:1;font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--soluk2)}
.rehber-kapat{position:absolute;top:8px;right:10px;border:0;background:none;font-size:20px;line-height:1;color:var(--soluk2);cursor:pointer;padding:4px 6px;border-radius:8px}
.rehber-kapat:hover{color:var(--yazi);background:#f0ede5}
@media(prefers-reduced-motion:reduce){.rehber-isik,.rehber-kart{transition:none}.don,.iskelet{animation:none}}
@media(max-width:1280px){.dortlu{grid-template-columns:repeat(2,minmax(0,1fr))}.duzen{grid-template-columns:minmax(0,1fr) 300px}}
@media(max-width:1100px){.uclu{grid-template-columns:repeat(2,minmax(0,1fr))}.iki,.iki-ters{grid-template-columns:1fr}.duzen{grid-template-columns:1fr}}
@media(max-height:760px){.ray a{padding:4px 0 3px}.ray .marka{margin-bottom:4px;width:34px;height:34px}}
@media(max-width:700px){.ray{width:56px}.ray a{width:46px;font-size:0}main,.ustbar{padding-left:12px;padding-right:12px}.uclu,.dortlu,.ikili{grid-template-columns:1fr}}
/* AugeLab Studio kurulum sihirbazı */
dialog.sh{border:0;border-radius:16px;padding:0;width:min(620px,94vw);max-height:calc(100vh - 24px);overflow:auto;background:var(--kart);color:var(--yazi);box-shadow:0 24px 60px rgba(17,19,24,.35)}
dialog.sh::backdrop{background:rgba(17,19,24,.55)}
dialog.sh.genis{width:min(980px,96vw)}
.sh .ic{padding:22px 24px}.sh.genis .ic{padding:16px 20px}
.sh-adimlar{display:flex;gap:6px;margin:0 0 18px;padding:0;list-style:none;counter-reset:a}.sh.genis .sh-adimlar{margin-bottom:12px}
.sh-adimlar li{flex:1;font-size:12px;color:var(--soluk);border-top:3px solid var(--cizgi);padding-top:6px;counter-increment:a}
.sh-adimlar li::before{content:counter(a) ". "}
.sh-adimlar li.su{color:var(--vurgu);border-color:var(--vurgu);font-weight:600}
.sh-adimlar li.bitti{color:var(--yesil);border-color:var(--yesil)}.sh-adimlar li.bitti::before{content:"✓ "}
.sh h2{font-size:19px;margin:0 0 8px}.sh.genis h2{margin-bottom:4px}.sh p{margin:0 0 10px}
.sh ol.yap{margin:6px 0 12px;padding-left:20px}.sh ol.yap li{margin:6px 0}
.sh kbd{font:12px var(--mono);background:var(--zemin);border:1px solid var(--cizgi);border-radius:5px;padding:1px 5px}
.sh-cubuk{height:8px;background:var(--cizgi);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.sh-cubuk i{display:block;height:100%;width:0;background:var(--vurgu);transition:width .3s}
.sh-bekle{display:flex;align-items:center;gap:8px;color:var(--soluk);font-size:13px}
.sh-don{width:14px;height:14px;border:2px solid var(--cizgi);border-top-color:var(--vurgu);border-radius:50%;animation:don 1s linear infinite;flex:none}
.sh .hata{background:var(--kirmizi-acik);color:#a3330f;padding:8px 10px;border-radius:8px;font-size:13px}
.sh-kod{display:flex;gap:8px;margin:12px 0 4px}.sh-kod input{flex:1;font:inherit;font-family:ui-monospace,Consolas,monospace;padding:9px 12px;border:1px solid var(--cizgi);border-radius:8px;background:var(--zemin,#111);color:var(--yazi)}
.sh-alt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px}
.sh-hesap{margin-top:14px}
.sh-hesap-ust{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--soluk);margin-bottom:6px;flex-wrap:wrap}
.sh-hesap-ust b{color:var(--yazi)}.sh-hesap-ust a,.sh-hesap-ust .bag{color:var(--vurgu);white-space:nowrap}
.sh-hesap-ust .baglar{display:flex;gap:14px;align-items:baseline}
.sh-hesap-ust .bag{border:0;background:none;font:inherit;cursor:pointer;padding:0;text-decoration:underline}
/* AugeLab hesap sayfası 370 px'lik bir logoyla başlar: çerçeve onun altından açılır, üye olma düğmeleri önce görünür. */
.sh-cerceve{position:relative;height:min(560px,54vh);overflow:hidden;border:1px solid var(--cizgi);border-radius:10px;background:#111}
.sh-cerceve iframe{position:absolute;left:0;top:-370px;width:100%;height:calc(100% + 370px);border:0;display:block}
.sh-cerceve.tam iframe{top:0;height:100%}
.sh-kaydir{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:none;background:var(--vurgu);color:#fff;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:sh-it 1.6s ease-in-out infinite;transition:opacity .4s}
.sh-kaydir.gitti{opacity:0}
@keyframes sh-it{50%{transform:translate(-50%,5px)}}
@media(prefers-reduced-motion:reduce){.sh-don,.sh-kaydir{animation:none}}
</style></head><body>
<nav class="ray" id="ray" aria-label="Ekranlar"></nav>
<div class="govde-alan">
  <header class="ustbar" id="ustbar"></header>
  <main id="sayfa"><div class="yukleniyor"><span class="don"></span>Yükleniyor…</div></main>
</div>
<div id="katman"></div>
<dialog id="sihirbaz" class="sh"><div class="ic">
  <ol class="sh-adimlar"><li>Studio’yu kur</li><li>AugeLab hesabı</li><li>Lisans kodu</li><li>Hazır</li></ol>
  <div id="sh-govde"></div>
  <div id="sh-model" class="uyari-seridi" hidden></div>
  <div id="sh-hesap" class="sh-hesap" hidden>
    <div class="sh-hesap-ust"><span id="sh-hesap-yazi"></span><span class="baglar"><button class="dug kucuk" id="sh-hesabim-var" type="button">Hesabım var</button><button class="bag" id="sh-ust" type="button">Sayfanın üstünü göster</button><a id="sh-hesap-bag" target="_blank" rel="noopener">Yeni pencerede aç ↗</a></span></div>
    <div class="sh-cerceve" id="sh-cerceve"><iframe id="sh-iframe" title="AugeLab hesabı"></iframe><div class="sh-kaydir" id="sh-kaydir">Formun devamı için çerçevede aşağı kaydırın ↓</div></div>
  </div>
  <div class="sh-alt"><button class="dug kucuk" id="sh-sonra" type="button">Sonra</button><span id="sh-eylem"></span></div>
</div></dialog>
<script src="/web/grafik.js"></script>
<script src="/web/uyg.js"></script>
<script src="/web/ekranlar.js"></script>
